[project]
name = "clawos"
version = "1.0.0"
description = "🦞 ClawOS AI Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ClawOS Team", email = "team@clawos.ai"}
]
keywords = ["ai", "操作系统", "推理引擎", "人工智能"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
gui = [
    "tkinter",
    "PyQt5>=5.15.0",
]
speech = [
    "edge-tts>=6.0.0",
    "pyaudio>=0.2.14",
]

[project.scripts]
clawos = "clawos.main:main_entry"

[project.urls]
Homepage = "https://clawos.ai"
Repository = "https://github.com/clawos/clawos"
Issues = "https://github.com/clawos/clawos/issues"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawos*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
