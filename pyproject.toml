[tool.poetry]
name = "intellicore"
version = "1.0.0"
description = "Enterprise Intelligent Decision System"
authors = ["IntelliCore Team"]
license = "Commercial"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
pydantic = "^2.0.0"
redis = "^5.0.0"
sqlalchemy = "^2.0.0"
aiohttp = "^3.8.0"

[tool.poetry.scripts]
intellicore = "intellicore.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
